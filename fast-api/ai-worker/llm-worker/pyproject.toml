[project]
name = "inktide-llm-worker"
version = "0.1.0"
description = "Redis Streams consumer that builds prompts and calls Ollama LLM"
requires-python = ">=3.10,<4.0"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis[asyncio]>=5.0",
    "httpx>=0.27.0",
    "stream2sentence>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
