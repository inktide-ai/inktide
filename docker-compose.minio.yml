# MinIO (S3-compatible). API :9000, console :9001.
# Create bucket "chimera-uploads" (or match S3Settings:DefaultBucket) in the console after start.
#
#   docker compose -f docker-compose.minio.yml up -d
#
# Then set in appsettings / user secrets:
#   S3Settings:Enabled = true
#   S3Settings:AccessKey / SecretKey = same as MINIO_ROOT_USER / MINIO_ROOT_PASSWORD

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio_data:/data

volumes:
  minio_data:
