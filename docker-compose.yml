
#
# Запуск инфры:                    docker compose --profile core up -d
# Запуск AI воркеров:              docker compose --profile workers up -d
# Запуск всего:                    docker compose --profile core --profile workers up -d
# Остановка:                       docker compose down
# Логи сервиса:                    docker compose logs -f keycloak
# Пересобрать один:                docker compose up -d --no-deps --build dotnet

# Сервисы и порты:
#   postgres    5432   — основная БД приложения
#   redis       6379   — кэш / pub-sub
#   qdrant      6333   — векторное хранилище (HTTP), 6334 (gRPC)
#   keycloak    8080   — SSO/OAuth2 (admin/admin)
#   minio       9000   — S3-хранилище (консоль: 9001)
#   dotnet      5001   — .NET API (включает LlmStreamWorker)
#   scribe      8001   — FastAPI факт-экстракция (Qwen via Ollama на хосте :11434)
#   kokoro      8880   — Kokoro TTS
#   ngrok       4040   — ngrok inspector (dev profile, туннель → :5001)
#
# Ollama запускается нативно на хосте :11434 — не контейнер.

services:

  dotnet:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64   # Rhubarb ships x86-64 only; Rosetta handles emulation on Apple Silicon
    profiles: [core]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TtsProviders__Kokoro__Endpoint: http://kokoro:8880/v1
      KeycloakSettings__MetadataAddress: http://keycloak:8080/realms/chimera/.well-known/openid-configuration
      KeycloakAdminSettings__BaseUrl: http://keycloak:8080
      Kestrel__Endpoints__Http__Url: http://+:5001
      RabbitMQSettings__Host: rabbitmq
      RabbitMQSettings__Username: ${RABBITMQ_USER:-inktide}
      RabbitMQSettings__Password: ${RABBITMQ_PASSWORD:-inktide}
      S3Settings__ServiceUrl: http://minio:9000
      S3Settings__PublicBaseUrl: http://localhost:9000
      S3Settings__AccessKey: ${MINIO_ROOT_USER}
      S3Settings__SecretKey: ${MINIO_ROOT_PASSWORD}
      # Qdrant (vector store)
      QdrantSettings__Host: qdrant
      # Ollama runs natively on the host
      OllamaSettings__Host: http://host.docker.internal
      EmotionClassificationOptions__OllamaBaseUrl: http://host.docker.internal:11434
      # Scribe fact extraction (workers profile)
      MemorySettings__ScribeBaseUrl: http://scribe:8001
      # SMTP settings come from .env (SmtpSettings__Host / Port / Username / Password)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compatibility; no-op on Docker Desktop
    ports:
      - "5001:5001"
    volumes:
      - dotnet_dataprotection:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  stripe-cli:
    image: stripe/stripe-cli:v1.42.1
    command: >
      listen
      --api-key ${StripeSettings__SecretKey}
      --forward-to http://dotnet:5001/api/billing/webhook/stripe
    profiles: [core]
    restart: unless-stopped
    depends_on:
      - dotnet

  # База данных приложения
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inktide}
      POSTGRES_USER: ${POSTGRES_USER:-inktide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inktide}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # У Keycloak своя БД чтобы не мешать с основной
  postgres-keycloak:
    image: postgres:16-alpine
    profiles: [core]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    environment:
      POSTGRES_DB: ${KC_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KC_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:-keycloak}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    profiles: [core]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768m
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: ${KC_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD:-keycloak}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak-extensions:/opt/keycloak/providers
    healthcheck:
      # Quarkus management port (9000) — available in Keycloak 17+ (this image: 25.0.6).
      # curl/wget are not present in the UBI-based image, so we use bash /dev/tcp.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: [core]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.6
    profiles: [core]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:latest
    profiles: [dev]   # dev only — catches all outgoing emails locally (http://localhost:8025)
    ports:
      - "1025:1025"
      - "8025:8025"

  ngrok:
    image: ngrok/ngrok:latest
    profiles: [dev]
    restart: no
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http host.docker.internal:3000 --log=stdout
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compatibility; no-op on Docker Desktop
    ports:
      - "4040:4040"   # ngrok web inspector — http://localhost:4040


  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: [core]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-inktide}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-inktide}
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI — http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    profiles: [core]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:5173,http://localhost:1420,tauri://localhost"
    ports:
      - "9000:9000"
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data

  scribe:
    build:
      context: fast-api/ai-worker/embeddings/scribe-model
      dockerfile: Dockerfile
    profiles: [workers]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    profiles: [workers]
    ports:
      - "8880:8880"
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  rabbitmq_data:
  dotnet_dataprotection:
