
#
# Запуск инфры:                    docker compose --profile core up -d
# Запуск AI воркеров:              docker compose --profile workers up -d
# Запуск всего:                    docker compose --profile core --profile workers up -d
# Остановка:                       docker compose down
# Логи сервиса:                    docker compose logs -f keycloak
# Пересобрать один:                docker compose up -d --no-deps --build dotnet

# Сервисы и порты:
#   postgres    5432   — основная БД приложения
#   redis       6379   — кэш / pub-sub
#   keycloak    8080   — SSO/OAuth2 (admin/admin)
#   minio       9000   — S3-хранилище (консоль: 9001)
#   dotnet      5001   — .NET API
#   llm-worker  —      — Redis stream consumer (Ollama: нативно на хосте :11434)
#   scribe      8001   — FastAPI факт-экстракция
#   kokoro      8880   — Kokoro TTS

services:

  dotnet:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64   # Rhubarb ships x86-64 only; Rosetta handles emulation on Apple Silicon
    profiles: [core]
    env_file:
      - .env
    environment:
      TtsProviders__Kokoro__Endpoint: http://kokoro:8880/v1
      KeycloakSettings__MetadataAddress: http://keycloak:8080/realms/chimera/.well-known/openid-configuration
      KeycloakAdminSettings__BaseUrl: http://keycloak:8080
      Kestrel__Endpoints__Http__Url: http://+:5001
      S3Settings__ServiceUrl: http://minio:9000
      S3Settings__PublicBaseUrl: http://localhost:9000
      S3Settings__AccessKey: ${MINIO_ROOT_USER}
      S3Settings__SecretKey: ${MINIO_ROOT_PASSWORD}
    ports:
      - "5001:5001"
    volumes:
      - dotnet_dataprotection:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # База данных приложения
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chimera}
      POSTGRES_USER: ${POSTGRES_USER:-chimera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chimera}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimera"]
      interval: 5s
      timeout: 5s
      retries: 5

  # У Keycloak своя БД чтобы не мешать с основной
  postgres-keycloak:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: ${KC_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KC_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:-keycloak}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    profiles: [core]
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: ${KC_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD:-keycloak}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-extensions:/opt/keycloak/providers
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: [core]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data

  llm-worker:
    build:
      context: fast-api/ai-worker/llm-worker
      dockerfile: Dockerfile
    profiles: [workers]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      redis:
        condition: service_started
        required: false
    restart: unless-stopped
    develop:
      watch:
        - path: fast-api/ai-worker/llm-worker/pyproject.toml
          action: rebuild
        - path: fast-api/ai-worker/llm-worker/app
          target: /app/app
          action: sync+restart

  # scribe:
  #   build:
  #     context: fast-api/ai-worker/embeddings/scribe-model
  #     dockerfile: Dockerfile
  #   profiles: [workers]
  #   env_file:
  #     - .env
  #   environment:
  #     OLLAMA_BASE_URL: http://ollama:11434
  #   ports:
  #     - "8001:8000"
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   restart: unless-stopped

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    profiles: [workers]
    ports:
      - "8880:8880"
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_postgres_data:
  redis_data:
  minio_data:
  dotnet_dataprotection:
