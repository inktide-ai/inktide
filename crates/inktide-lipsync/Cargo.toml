[package]
name = "inktide-lipsync"
version = "0.1.0"
edition = "2021"
# is_none_or stabilized in 1.82.0; bump when adopting newer APIs.
rust-version = "1.82"

[lib]
name = "inktide_lipsync"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
tempfile = "3"
thiserror = "2"
which = "7"
tracing = "0.1"
wait-timeout = "0.2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "blend_state"
harness = false
