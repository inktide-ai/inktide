# Single-VM deployment: the whole stack behind Caddy with automatic HTTPS.
#
#   cd deploy/server
#   ./make-env.sh <app-host>          # once: writes .env with generated secrets
#   docker compose up -d --build
#   ./setup-keycloak.sh               # once: realm, client and demo user
#
# Every service restarts with the Docker daemon, so stopping and starting the VM
# brings the stack back without manual steps.

name: inktide

x-restart: &restart
  restart: unless-stopped

services:

  caddy:
    <<: *restart
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, keycloak]

  web:
    <<: *restart
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: https://auth.${APP_HOST}
        NEXT_PUBLIC_STORAGE_URL: https://s3.${APP_HOST}
        BACKEND_URL: http://api:5001
    image: inktide-web:server
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://${APP_HOST}
      AUTH_TRUST_HOST: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      NEXT_PUBLIC_KEYCLOAK_URL: https://auth.${APP_HOST}
      NEXT_PUBLIC_KEYCLOAK_REALM: chimera
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: chimera-web
      NEXT_PUBLIC_STORAGE_URL: https://s3.${APP_HOST}
      BACKEND_URL: http://api:5001
      # app/api/auth/ws-ticket stores one-time SignalR tickets that the API reads back.
      REDIS_URL: redis://redis:6379
    # NextAuth talks to Keycloak through its public URL; resolving that name to
    # the host keeps the request on the machine (through Caddy) instead of
    # relying on hairpin NAT back through the public IP.
    extra_hosts:
      - "auth.${APP_HOST}:host-gateway"
    depends_on: [api, redis]

  api:
    <<: *restart
    build:
      context: ../..
      dockerfile: Dockerfile
    image: inktide-api:server
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Serilog__MinimumLevel__Default: Information
      Kestrel__Endpoints__Http__Url: http://+:5001
      PostgresSettings__Host: postgres
      RedisSettings__BaseAddress: redis
      RabbitMQSettings__Host: rabbitmq
      QdrantSettings__Host: qdrant
      S3Settings__ServiceUrl: http://minio:9000
      S3Settings__PublicBaseUrl: https://s3.${APP_HOST}
      KeycloakSettings__Authority: https://auth.${APP_HOST}/realms/chimera
      KeycloakSettings__MetadataAddress: http://keycloak:8080/realms/chimera/.well-known/openid-configuration
      KeycloakSettings__RequireHttpsMetadata: "false"
      KeycloakSettings__Audience: account
      KeycloakAdminSettings__Enabled: "false"
      CorsSettings__AllowedOrigins__0: https://${APP_HOST}
      TtsProviders__Kokoro__Endpoint: http://kokoro:8880/v1
      OllamaSettings__Host: http://ollama
      EmotionClassificationOptions__OllamaBaseUrl: http://ollama:11434
      MemoryOptions__ScribeBaseUrl: http://scribe:8000
      TelegramSettings__FrontendBaseUrl: https://${APP_HOST}
      BillingSettings__SuccessUrl: https://${APP_HOST}/billing/success
      BillingSettings__CancelUrl: https://${APP_HOST}
      # These modules need real third-party credentials before they can start.
      "Modules__Developer.Infrastructure__Enabled": "false"
      "Modules__Developer.REST__Enabled": "false"
      "Modules__Connector.Discord__Enabled": "false"
      "Modules__Connector.Twitch__Enabled": "false"
    extra_hosts:
      - "auth.${APP_HOST}:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inktide
      POSTGRES_USER: inktide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inktide -d inktide"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-keycloak:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:25.0.6
    command: start
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD}
      KC_HOSTNAME: https://auth.${APP_HOST}
      # Token, JWKS and userinfo calls from the API and web containers reach
      # Keycloak by its internal name; let it answer them with that name.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../../keycloak-extensions:/opt/keycloak/providers:ro
    depends_on:
      postgres-keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  redis:
    <<: *restart
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    <<: *restart
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: inktide
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The upstream minio/minio image was withdrawn from Docker Hub; pgsty/minio is
  # a maintained build of the same community server with the same CLI.
  minio:
    <<: *restart
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_HOST}
    volumes:
      - minio_data:/data

  kokoro:
    <<: *restart
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2

  ollama:
    <<: *restart
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  scribe:
    <<: *restart
    build:
      context: ../../fast-api/ai-worker/embeddings/scribe-model
    image: inktide-scribe:server
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: qwen2.5:1.5b
      OLLAMA_EMBED_MODEL: nomic-embed-text
    depends_on: [ollama]

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  keycloak_postgres_data:
  redis_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:
  ollama_data:
