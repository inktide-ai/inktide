# Chimera email theme
# {0} in "expires" lines = duration from Realm settings → Tokens (User-Initiated Action Lifespan, etc.), not fixed here.
passwordResetTitle=To reset your password, follow the link
emailVerificationTitle=Verify your email
passwordResetBodyHtmlNoLink=<p style='color: rgba(255,255,255,0.9); margin: 0 0 1rem; font-size: 14px; line-height: 16px;'>Someone requested to reset your {0} account password. If this was you, click the button below:</p>
passwordResetLinkText=Reset password
passwordResetBodyHtmlAfter=<p style='color: rgba(255,255,255,0.7); font-size: 14px; line-height: 16px; margin: 0;'>This link expires in {0}.</p><p style='color: rgba(255,255,255,0.6); font-size: 12px; line-height: 16px; margin-top: 1rem;'>If you didn't request this, ignore this email.</p>
emailVerificationBodyHtmlNoLink=<p style='color: rgba(255,255,255,0.9); margin: 0 0 1rem; font-size: 14px; line-height: 16px;'>Someone created a {0} account with this email. If this was you, click the button below:</p>
emailVerificationLinkText=Verify email
emailVerificationBodyHtmlAfter=<p style='color: rgba(255,255,255,0.7); font-size: 14px; line-height: 16px; margin: 0;'>This link expires in {0}.</p><p style='color: rgba(255,255,255,0.6); font-size: 12px; line-height: 16px; margin-top: 1rem;'>If you didn't create this account, ignore this email.</p>