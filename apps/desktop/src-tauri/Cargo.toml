[package]
name = "inktide-desktop"
version = "0.1.0"
description = "Inktide Desktop — AI companion for streaming"
authors = []
edition = "2021"

# The lib target is required by Tauri's code generation (mobile builds need cdylib).
[lib]
name = "inktide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon"] }
tauri-plugin-shell = "2.3"
tauri-plugin-deep-link = "2.4"
tauri-plugin-notification = "2.3"
tauri-plugin-store = "2.4"
tauri-plugin-updater = "2.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
