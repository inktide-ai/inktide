# Quackie login theme: "the site is a stream". Signing up is labelling a blank VHS tape,
# logging in is putting your tape back in the deck. Plain FreeMarker + CSS + a little JS,
# so the theme ships as a folder mounted into /opt/keycloak/themes, with no build step.
parent=base
import=common/keycloak
locales=en,ru
# Bump after editing css/ or js/: the files keep their URL until Keycloak itself is upgraded, so
# this query string is what makes browsers fetch the new ones.
qkAssetsVersion=3
