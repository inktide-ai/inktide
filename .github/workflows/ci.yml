name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # .NET backend: restore → build → test
  # ─────────────────────────────────────────────────────────────
  backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore Inktide.API.sln

      - name: Build (Release)
        run: dotnet build Inktide.API.sln -c Release --no-restore -v minimal

      - name: Test
        run: dotnet test Inktide.API.sln --no-build -c Release -v minimal
        # Will be a no-op until test projects are added; keeps the step so it's visible in CI.

  # ─────────────────────────────────────────────────────────────
  # Frontend: install → lint → build
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: inktide
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: inktide-web

  # ─────────────────────────────────────────────────────────────
  # Docker image build (on push to main only)
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: inktide-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
