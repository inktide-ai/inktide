name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job gets the least privilege it needs. The default token is
# read/write on contents, which no job here requires.
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.x'
  NODE_VERSION: '22'
  # Matches requires-python in the workers and the python:3.12-slim base image
  # their Dockerfiles use. Test what production runs.
  PYTHON_VERSION: '3.12'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------
  # .NET backend: restore -> build -> test
  # ---------------------------------------------------------------
  backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Central Package Management gives every project one pinned version set,
      # so the lock is keyed on the two manifests plus the project files.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Inktide.API.sln

      - name: Build (Release)
        run: dotnet build Inktide.API.sln -c Release --no-restore -v minimal

      - name: Test
        run: dotnet test Inktide.API.sln --no-build -c Release -v minimal

  # ---------------------------------------------------------------
  # Frontend: lint -> typecheck -> build -> test
  # ---------------------------------------------------------------
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    env:
      # next.config.ts refuses to produce a production build without this, so
      # that an image can never ship pointing at localhost. CI only needs the
      # build to succeed, so a placeholder is supplied explicitly.
      BACKEND_URL: http://127.0.0.1:5001
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: chimera
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: chimera-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --prune-suppressions fails the run when eslint-suppressions.json lists
      # a violation that no longer exists, so the baseline shrinks with the
      # code instead of going stale. See eslint-suppressions.README.md.
      - name: Lint
        run: npm run lint -- --prune-suppressions

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  # ---------------------------------------------------------------
  # Python AI workers: ruff lint + pytest
  # ---------------------------------------------------------------
  python:
    name: Python Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker:
          - fast-api/ai-worker/llm-worker
          - fast-api/ai-worker/embeddings/scribe-model
          - fast-api/ai-worker/embeddings/semantic-model

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ matrix.worker }}/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: ${{ matrix.worker }}

      # Rules come from the repository-root ruff.toml, which ruff finds by
      # walking up from each file. Workers do not carry their own copy.
      - name: Lint (ruff)
        run: python -m ruff check .
        working-directory: ${{ matrix.worker }}

      - name: Test
        run: python -m pytest -q
        working-directory: ${{ matrix.worker }}

  # ---------------------------------------------------------------
  # Rust crates: fmt + clippy + test
  # ---------------------------------------------------------------
  rust:
    name: Rust Crates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates -> target'

      - name: Format check
        run: cargo fmt --check

      # Lint levels live in [workspace.lints] in crates/Cargo.toml, so a local
      # `cargo clippy` and this step apply exactly the same policy. --all-targets
      # also covers benches and tests, which the bare invocation skipped - that
      # is how an unformatted bench reached the default branch.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # ---------------------------------------------------------------
  # Docker image: builds from source on every PR
  # ---------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    # The image is built from the same sources these jobs check, so there is no
    # point spending build minutes on a tree that already failed.
    needs: [backend, frontend]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Previously this only ran on push to main, so a Dockerfile change could
      # not break until after merge. It now runs on pull requests too: the
      # image builds from source and no longer depends on a publish/ directory
      # that is gitignored and absent from a clean checkout.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          tags: inktide-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
