global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "chimera-api-gateway"
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: chimera-api-gateway

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
